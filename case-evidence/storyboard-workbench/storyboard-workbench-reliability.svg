<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="80 0 1640 1000" role="img" aria-labelledby="title desc">
  <title id="title">分鏡提案工作台效能與可靠性紀錄</title>
  <desc id="desc">代表性專案實測的 Draft Preview、Published Preview 與約十二張素材 Publish 效能改善，以及 v47 107 項自動化測試與真實流程 smoke test。</desc>
  <rect x="80" width="1640" height="1000" fill="#efefec"/>
  <g font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="110" y="130" font-size="26" font-weight="700" fill="#d94b2b" letter-spacing="3">CHECKPOINT EVIDENCE</text>
    <text x="110" y="205" font-size="62" font-weight="800" fill="#121820">速度改善，也保留發布邊界。</text>
    <text x="110" y="252" font-size="23" fill="#555b61">代表性專案實測／checkpoint 紀錄，非 SLA。</text>
  </g>
  <g transform="translate(110 330)" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <rect width="1580" height="385" rx="18" fill="#ffffff" stroke="#bfc2c0" stroke-width="2"/>
    <text x="42" y="65" font-size="22" font-weight="800" fill="#121820">代表性流程實測</text>
    <g transform="translate(42 115)">
      <text y="0" font-size="20" fill="#555b61">Draft Preview 完整圖片</text>
      <text y="64" font-size="43" font-weight="800" fill="#121820">62–66 秒</text><text x="238" y="64" font-size="34" fill="#d94b2b">→</text><text x="300" y="64" font-size="43" font-weight="800" fill="#121820">約 11.5 秒</text>
      <line y1="105" x2="1496" y2="105" stroke="#d8dad8"/>
      <text y="156" font-size="20" fill="#555b61">Published Preview 完整圖片</text>
      <text y="220" font-size="43" font-weight="800" fill="#121820">102.7 秒</text><text x="238" y="220" font-size="34" fill="#d94b2b">→</text><text x="300" y="220" font-size="43" font-weight="800" fill="#121820">約 20.6 秒</text>
      <line y1="261" x2="1496" y2="261" stroke="#d8dad8"/>
      <text y="312" font-size="20" fill="#555b61">約 12 張素材 Publish</text>
      <text y="376" font-size="43" font-weight="800" fill="#121820">約 129 秒</text><text x="238" y="376" font-size="34" fill="#d94b2b">→</text><text x="300" y="376" font-size="43" font-weight="800" fill="#121820">50 秒級</text>
    </g>
  </g>
  <g transform="translate(110 775)" font-family="Inter, Noto Sans TC, Microsoft JhengHei, sans-serif">
    <rect width="760" height="190" rx="18" fill="#121820"/>
    <text x="36" y="54" font-size="18" font-weight="800" fill="#f3a18d">AUTOMATED CHECKPOINT</text>
    <text x="36" y="121" font-size="54" font-weight="800" fill="#ffffff">v47 · 107/107 passed</text>
    <text x="36" y="158" font-size="20" fill="#d7dde1">完整自動化測試基線</text>
    <rect x="820" width="760" height="190" rx="18" fill="#ffffff" stroke="#bfc2c0" stroke-width="2"/>
    <text x="856" y="54" font-size="18" font-weight="800" fill="#d94b2b">RUNTIME CHECKPOINT</text>
    <text x="856" y="112" font-size="32" font-weight="800" fill="#121820">真實流程 smoke test 已完成</text>
    <text x="856" y="151" font-size="20" fill="#555b61">Workbench、Draft、Preview、人工 Publish 與固定匿名提案頁</text>
  </g>
</svg>
